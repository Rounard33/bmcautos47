<header class="header" [class.scrolled]="isScrolled">
  <div class="container">
    <div class="header-content">
      <!-- Logo -->
      <div class="logo">
        <a routerLink="/" class="logo-link" (click)="smoothScrollToSection('home', $event)">
          <div class="logo-container">
            <div class="logo-icon">
              <img src="assets/logo/logo.png" alt="BMC AUTOS 47 Logo">
            </div>
          </div>
        </a>
      </div>

      <!-- Navigation -->
      <nav class="nav" [class.nav-open]="isMenuOpen" id="mobile-menu" role="navigation" aria-label="Menu principal">
        <!-- Close Button -->
        <button 
          class="nav-close" 
          (click)="toggleMenu()" 
          *ngIf="isMenuOpen"
          aria-label="Fermer le menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        
        <ul class="nav-list">
          <li class="nav-item">
            <a href="#home" class="nav-link" (click)="smoothScrollToSection('home', $event)">
              <span class="nav-text">Accueil</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#vehicles" class="nav-link" (click)="smoothScrollToSection('vehicles', $event)">
              <span class="nav-text">Nos véhicules</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#about" class="nav-link" (click)="smoothScrollToSection('about', $event)">
              <span class="nav-text">À propos</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#services" class="nav-link" (click)="smoothScrollToSection('services', $event)">
              <span class="nav-text">Services</span>
            </a>
          </li>
          <li class="nav-item nav-item-cta">
            <a href="#contact" class="nav-link nav-cta" (click)="smoothScrollToSection('contact', $event)">
              <span class="nav-text">Nous contacter</span>
              <svg class="nav-cta-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </a>
          </li>
        </ul>
      </nav>

      <!-- Mobile Menu Toggle -->
      <button 
        class="mobile-menu-toggle" 
        (click)="toggleMenu()" 
        [attr.aria-expanded]="isMenuOpen"
        [attr.aria-label]="isMenuOpen ? 'Fermer le menu' : 'Ouvrir le menu'"
        aria-controls="mobile-menu">
        <span class="hamburger-line" [class.active]="isMenuOpen"></span>
        <span class="hamburger-line" [class.active]="isMenuOpen"></span>
        <span class="hamburger-line" [class.active]="isMenuOpen"></span>
      </button>
    </div>
  </div>
</header>
